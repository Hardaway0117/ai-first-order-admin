services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: ai-first-order-admin-app
        volumes:
            - .:/var/www/html
        environment:
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-ai_first_order_admin}
            DB_USERNAME: ${DB_USERNAME:-app}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
        depends_on:
            mysql:
                condition: service_healthy

    nginx:
        image: nginx:1.27-alpine
        container_name: ai-first-order-admin-nginx
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    mysql:
        image: mysql:8.0
        container_name: ai-first-order-admin-mysql
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-ai_first_order_admin}
            MYSQL_USER: ${DB_USERNAME:-app}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        ports:
            - "${DB_FORWARD_PORT:-33060}:3306"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    mysql-data:
